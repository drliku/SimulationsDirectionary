<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulations Directory</title>
  <meta name="description" content="Interactive science simulations from The Brain Maze, sorted by subject.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Saira fills in characters Brain doesn't have (& ( ) - / ×) and is used for body copy -->
  <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Saira:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="page">

    <header class="topbar">
      <a class="brand" href="https://thebrainmaze.com/">
        <img src="assets/brainmaze-logo.png" alt="The Brain Maze">
      </a>
    </header>

    <section class="hero">
      <div>
        <p class="eyebrow">Simulations directory</p>
        <h1><span class="title-a">Explore</span> <span class="title-b">by simulation</span></h1>
        <p class="subtitle">Hands-on models you can drag, spin and play with. Pick a subject and launch a simulation.</p>
      </div>
      <aside class="sticker" aria-live="polite">
        <div class="sticker-tag">In the lab</div>
        <div class="sticker-big" id="simCount">0</div>
        <p>simulations across <span id="subjectCount">6</span> subjects</p>
      </aside>
    </section>

    <nav class="filters" aria-label="Filter by subject">
      <div class="chips" id="filters" role="tablist"></div>
      <label class="search">
        <span class="visually-hidden">Search simulations</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input type="search" id="search" placeholder="Search simulations" autocomplete="off">
      </label>
    </nav>

    <main id="directory"></main>

    <p class="empty-search" id="noResults" hidden>No simulations match that search.</p>

    <footer class="foot">
      <a href="https://thebrainmaze.com/">Back to The Brain Maze</a>
    </footer>
  </div>

  <script src="js/simulations.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
